[graph]
all-features = true

[advisories]
unmaintained = "workspace"
unsound = "all"
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2026-0049", reason = "Serenity's Discord gateway uses rustls-webpki 0.102 through rustls 0.22. The fix requires 0.103.10 or later." },
    { id = "RUSTSEC-2026-0098", reason = "Serenity's Discord gateway uses rustls-webpki 0.102 through rustls 0.22. The fix requires 0.103.12 or later." },
    { id = "RUSTSEC-2026-0099", reason = "Serenity's Discord gateway uses rustls-webpki 0.102 through rustls 0.22. The fix requires 0.103.12 or later." },
    { id = "RUSTSEC-2026-0104", reason = "Serenity's Discord gateway uses rustls-webpki 0.102 through rustls 0.22. The fix requires 0.103.13 or later." },
    { id = "RUSTSEC-2026-0346", reason = "Serenity's Discord gateway uses rustls 0.22 through tokio-tungstenite 0.21. The fix requires rustls 0.23.46 or later." },
    { id = "RUSTSEC-2026-0349", reason = "Serenity's Discord gateway uses rustls 0.22 through tokio-tungstenite 0.21. The fix requires rustls 0.23.46 or later." },
    { id = "RUSTSEC-2026-0382", reason = "Serenity's Discord gateway uses rustls-webpki 0.102 through rustls 0.22. The fix requires 0.103.16 or later." },
    { id = "RUSTSEC-2026-0543", reason = "All chrono releases are unmaintained. Steward uses chrono for date and time handling, and replacement requires a code migration." },
    { id = "RUSTSEC-2026-0555", reason = "All chrono-tz releases are unmaintained. Steward uses chrono-tz for time zone handling, and replacement requires a code migration." },
]

[licenses]
confidence-threshold = 0.93
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "GPL-3.0-or-later",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
