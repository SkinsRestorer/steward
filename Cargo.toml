[package]
name = "steward"
version = "1.0.0"
edition = "2024"
rust-version = "1.97.1"
description = "Support and moderation Discord bots for SkinsRestorer and SoulFire"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1.0.100"
chrono = "0.4.42"
chrono-tz = "0.10.4"
dotenvy = "0.15.7"
futures = "0.3.31"
image = { version = "0.25.9", default-features = false, features = ["jpeg", "png", "webp"] }
ocrs = "0.14.0"
poise = { version = "0.7.0", default-features = false, features = ["cache", "chrono", "handle_panics"] }
regex = "1.12.2"
reqwest = { version = "0.13.4", default-features = false, features = ["brotli", "gzip", "http2", "json", "rustls", "stream"] }
rig-agent = { version = "0.47.0", default-features = false }
rig-core = { version = "0.47.0", default-features = false }
rig-reqwest = { version = "0.47.0", default-features = false }
roxmltree = "0.21.1"
rten = { version = "0.28.0", default-features = false, features = ["rten_format"] }
schemars = "1.2.1"
semver = "1.0.28"
serde = { version = "1.0.228", features = ["derive"] }
serde-transcode = "1.1.1"
serde_json = "1.0.149"
serenity = { version = "0.12.5", default-features = false, features = ["native_tls_backend"] }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["fs", "macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
unicode-normalization = "0.1.25"
yaml_serde = "0.10.4"

[dev-dependencies]
rig-agent = { version = "0.47.0", default-features = false, features = ["test-utils"] }

[profile.release]
lto = "thin"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"
unused_qualifications = "warn"
unused_lifetimes = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
let_underscore_drop = "warn"
unit_bindings = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Owner-approved nursery exceptions
missing_const_for_fn = "allow"
option_if_let_else = "allow"
future_not_send = "allow"
redundant_pub_crate = "allow"
suboptimal_flops = "allow"

unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
map_err_ignore = "warn"
unused_result_ok = "warn"
redundant_clone = "warn"

# Safety and correctness
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
string_slice = "warn"
float_cmp_const = "warn"
lossy_float_literal = "warn"
mem_forget = "warn"
exit = "warn"
rc_buffer = "warn"
fn_to_numeric_cast_any = "warn"
infinite_loop = "warn"
try_err = "warn"
rest_pat_in_fully_bound_structs = "warn"
iter_over_hash_type = "warn"
let_underscore_must_use = "warn"
significant_drop_tightening = "warn"

unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
panic_in_result_fn = "warn"
unreachable = "warn"
clone_on_ref_ptr = "warn"
wildcard_enum_match_arm = "warn"
format_push_string = "warn"
empty_structs_with_brackets = "warn"
empty_enum_variants_with_brackets = "warn"

# Better test failures
assertions_on_result_states = "warn"
missing_assert_message = "warn"

disallowed_methods = "warn"
