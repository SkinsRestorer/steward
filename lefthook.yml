min_version: 1.13.6

pre-commit:
  commands:
    whitespace:
      run: git diff --cached --check
    rustfmt:
      glob: "*.rs"
      run: cargo fmt --all --check
      files: git diff --cached --name-only --diff-filter=ACMR

commit-msg:
  commands:
    conventional-commit:
      run: |
        if ! sed -n '1p' "{1}" | grep -Eq '^(Merge |Revert "|fixup! |squash! |amend! )|^(feat|fix|docs|refactor|test|chore|ci|build|perf|style|revert)(\([^()[:space:]]+\))?!?: [[:space:]]*[^[:space:]]'; then
          printf '%s\n' 'Use a Conventional Commit subject, for example: fix(ocr): handle empty input.' >&2
          exit 1
        fi

pre-push:
  commands:
    clippy:
      run: cargo clippy --all-targets --all-features -- -D warnings
      files: git diff --name-only @{upstream} HEAD
      glob: "{*.rs,Cargo.toml,Cargo.lock,clippy.toml,rust-toolchain.toml}"
    cargo-deny:
      run: cargo deny --locked check
      files: git diff --name-only @{upstream} HEAD
      glob: "{Cargo.toml,Cargo.lock,deny.toml}"
