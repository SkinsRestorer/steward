name: Rust

on:
  push:
  pull_request:
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

# A newer push to the same ref supersedes the older run. The event name keeps a scheduled
# run from cancelling a push run on main, which would skip that commit's deployment.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: "${{ github.event_name != 'pull_request' || github.repository != github.event.pull_request.head.repo.full_name }}"
    runs-on: ubuntu-latest

    strategy:
      matrix:
        rust: ["1.97.1", "1.100.0"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy,rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-targets

      - name: Build release binary
        run: cargo build --release --locked

  deny:
    name: Check dependency policy
    if: "${{ github.event_name != 'pull_request' || github.repository != github.event.pull_request.head.repo.full_name }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cargo-deny
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-deny@0.20.2
          fallback: none

      - name: Check dependencies
        run: cargo deny --locked check

  railpack:
    name: Verify Railpack checksums
    if: "${{ github.event_name != 'pull_request' || github.repository != github.event.pull_request.head.repo.full_name }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The publish workflow holds the pinned version and checksums. Check them here so a
      # stale checksum fails before merge instead of during deployment.
      - name: Check pinned Railpack archives
        run: |
          workflow=.github/workflows/publish-ghcr.yml
          version=$(yq --exit-status '.env.RAILPACK_VERSION' "$workflow")
          mapfile -t pins < <(yq --exit-status '.jobs.build.strategy.matrix.include[] | .railpack_target + " " + .railpack_sha256' "$workflow")
          if [ "${#pins[@]}" -eq 0 ]; then
            echo "::error file=$workflow::No Railpack checksums found"
            exit 1
          fi

          status=0
          for pin in "${pins[@]}"; do
            read -r target expected <<< "$pin"
            archive="railpack-${version}-${target}.tar.gz"
            curl --fail --silent --show-error --location --output "$RUNNER_TEMP/$archive" \
              "https://github.com/railwayapp/railpack/releases/download/${version}/${archive}"
            actual=$(sha256sum "$RUNNER_TEMP/$archive" | cut -d ' ' -f 1)
            if [ "$actual" = "$expected" ]; then
              echo "$archive: OK"
            else
              echo "::error file=$workflow::$archive has SHA-256 $actual, but the workflow pins $expected"
              status=1
            fi
          done
          exit "$status"
